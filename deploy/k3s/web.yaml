apiVersion: v1
kind: Service
metadata:
  name: forge-web
  namespace: forge
spec:
  selector:
    app: forge-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-web
  namespace: forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forge-web
  template:
    metadata:
      labels:
        app: forge-web
    spec:
      containers:
        - name: web
          image: yourorg/forge-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: forge-config
                  key: API_URL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
