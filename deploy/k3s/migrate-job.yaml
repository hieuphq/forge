apiVersion: batch/v1
kind: Job
metadata:
  name: forge-migrate
  namespace: forge
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: forge-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: yourorg/forge-migrate:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: forge-secret
                  key: DATABASE_URL
